[workspace]
members = ["crates/rsicraft-core", "crates/rsicraft-mcp", "crates/rsicraft-app"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sandraschi fleet"]
repository = "https://github.com/sandraschi/rsicraft"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
blake3 = "1.5"
zstd = "0.13"
uuid = { version = "1.9", features = ["v4"] }
ureq = { version = "2.10", features = ["json"] }
eframe = "0.37"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
